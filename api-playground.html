<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body class="utility-page api-page">

    <div class="container">
        
        <!-- HEADER -->
        <header>
            <div>
                <h1>API_PLAYGROUND</h1>
                <p>UTILITY_02 // MOCK CLIENT & HTTP INTERFACE</p>
            </div>
            <div class="status-badge">
                STATUS: READY
            </div>
        </header>

        <!-- CONTROLS CONTAINER -->
        <div class="b-box">
            <h2>// REQUEST BUILDER</h2>
            
            <!-- QUICK TEST PRESETS -->
            <label>QUICK API PRESETS:</label>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="runGetPostPreset()">GET JSONPLACEHOLDER POST</button>
                <button class="preset-btn" onclick="runGetIpPreset()">GET PUBLIC IP</button>
                <button class="preset-btn" onclick="runPostPreset()">POST MOCK DATA</button>
            </div>

            <!-- REQUEST BAR -->
            <div class="request-bar">
                <select id="httpMethod" onchange="toggleBodyInput()">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                </select>
                <input type="text" id="requestUrl" class="url-input" value="https://jsonplaceholder.typicode.com/posts/1" placeholder="Enter endpoint URL...">
                <button class="b-button" onclick="executeRequest()">EXECUTE // SEND</button>
            </div>

            <!-- OPTIONAL BODY INPUT FOR POST/PUT -->
            <div id="bodyContainer" style="display: none; margin-top: 1rem;">
                <label for="requestBody">REQUEST BODY (RAW JSON):</label>
                <textarea id="requestBody" rows="5" placeholder="{&quot;key&quot;: &quot;value&quot;}"></textarea>
            </div>
        </div>

        <!-- OUTPUT GRID -->
        <div class="grid-2">
            
            <!-- RESPONSE HEADERS / STATUS -->
            <div class="b-box" style="margin-bottom: 0;">
                <h2>// RESPONSE META</h2>
                <label>STATUS & PROTOCOL:</label>
                <div id="responseMeta" class="output-box" style="min-height: 80px; max-height: 120px;">// AWAITING EXECUTION...</div>
                <div style="margin-top: 1.5rem;">
                    <label>RESPONSE HEADERS:</label>
                    <div id="responseHeaders" class="output-box" style="min-height: 120px; max-height: 200px;">// NO HEADERS LOGGED</div>
                </div>
            </div>

            <!-- RESPONSE PAYLOAD -->
            <div class="b-box" style="margin-bottom: 0;">
                <h2>// RESPONSE PAYLOAD</h2>
                <label>RAW DATA BODY:</label>
                <div id="responsePayload" class="output-box">// AWAITING EXECUTION...</div>
                <div class="meta-stats">
                    <span id="execTime">TIME: 0ms</span>
                    <button class="preset-btn" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;" onclick="copyPayload()">COPY PAYLOAD</button>
                </div>
            </div>

        </div>

        <!-- BACK LINK -->
        <div class="footer-nav">
            <a href="index.html" class="b-button"><- BACK TO PORTFOLIO</a>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        function toggleBodyInput() {
            const method = document.getElementById('httpMethod').value;
            const bodyContainer = document.getElementById('bodyContainer');
            if (method === 'POST' || method === 'PUT') {
                bodyContainer.style.display = 'block';
            } else {
                bodyContainer.style.display = 'none';
            }
        }

        // Dedicated preset handlers to avoid HTML escaping bugs
        function runGetPostPreset() {
            document.getElementById('httpMethod').value = 'GET';
            document.getElementById('requestUrl').value = 'https://jsonplaceholder.typicode.com/posts/1';
            document.getElementById('requestBody').value = '';
            toggleBodyInput();
            executeRequest();
        }

        function runGetIpPreset() {
            document.getElementById('httpMethod').value = 'GET';
            document.getElementById('requestUrl').value = 'https://api.ipify.org?format=json';
            document.getElementById('requestBody').value = '';
            toggleBodyInput();
            executeRequest();
        }

        function runPostPreset() {
            document.getElementById('httpMethod').value = 'POST';
            document.getElementById('requestUrl').value = 'https://jsonplaceholder.typicode.com/posts';
            document.getElementById('requestBody').value = JSON.stringify({
                title: "Brutalist Post",
                body: "Testing API mock client layout",
                userId: 1
            }, null, 2);
            toggleBodyInput();
            executeRequest();
        }

        async function executeRequest() {
            const method = document.getElementById('httpMethod').value;
            const url = document.getElementById('requestUrl').value;
            const bodyInput = document.getElementById('requestBody').value;
            
            const metaBox = document.getElementById('responseMeta');
            const headersBox = document.getElementById('responseHeaders');
            const payloadBox = document.getElementById('responsePayload');
            const timeSpan = document.getElementById('execTime');

            if (!url) {
                alert('ENTER A VALID URL');
                return;
            }

            metaBox.textContent = '// SENDING REQUEST...';
            headersBox.textContent = '// FETCHING HEADERS...';
            payloadBox.textContent = '// WAITING FOR SERVER RESPONSE...';

            const startTime = performance.now();

            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            if ((method === 'POST' || method === 'PUT') && bodyInput) {
                try {
                    JSON.parse(bodyInput);
                    options.body = bodyInput;
                } catch (e) {
                    metaBox.textContent = 'ERROR: INVALID JSON BODY SYNTAX';
                    metaBox.className = 'output-box status-error';
                    payloadBox.textContent = e.message;
                    return;
                }
            }

            try {
                const response = await fetch(url, options);
                const endTime = performance.now();
                const duration = Math.round(endTime - startTime);
                timeSpan.textContent = `TIME: ${duration}ms`;

                const statusClass = response.ok ? 'status-success' : 'status-error';
                metaBox.className = `output-box ${statusClass}`;
                metaBox.textContent = `HTTP/1.1 ${response.status} ${response.statusText}\nTYPE: CLIENT EXECUTION SUCCESS`;

                let headersString = '';
                response.headers.forEach((value, key) => {
                    headersString += `${key}: ${value}\n`;
                });
                headersBox.textContent = headersString || '// NO HEADERS RETURNED';

                const contentType = response.headers.get('content-type');
                let responseData;
                if (contentType && contentType.includes('application/json')) {
                    const json = await response.json();
                    responseData = JSON.stringify(json, null, 2);
                } else {
                    responseData = await response.text();
                }

                payloadBox.className = `output-box ${statusClass}`;
                payloadBox.textContent = responseData;

            } catch (error) {
                const endTime = performance.now();
                timeSpan.textContent = `TIME: ${Math.round(endTime - startTime)}ms`;
                metaBox.className = 'output-box status-error';
                metaBox.textContent = 'HTTP 000 // NETWORK / CORS ERROR';
                headersBox.textContent = '// CONNECTION FAILED';
                payloadBox.className = 'output-box status-error';
                payloadBox.textContent = `ERROR: ${error.message}`;
            }
        }

        function copyPayload() {
            const text = document.getElementById('responsePayload').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('PAYLOAD COPIED TO CLIPBOARD');
            });
        }
    </script>
</body>
</html>
