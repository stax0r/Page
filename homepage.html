<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMEPAGE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="homepage">
    <header class="home-header">
        <div>
            <h1>HOME</h1>
            <p>PERSONAL STARTPAGE // SIGNAL INTAKE</p>
        </div>
        <div class="status">SYSTEM: ONLINE</div>
    </header>

    <main class="home-grid">
        <section class="home-panel">
            <h2>// QUICK ACCESS</h2>
            <div class="channel-list">
                <div class="access-category">
                    <h3>EMAIL</h3>
                    <a href="https://mail.google.com/" target="_blank" rel="noopener noreferrer">GMAIL</a>
                    <a href="https://mail.proton.me/" target="_blank" rel="noopener noreferrer">PROTONMAIL</a>
                </div>
                <div class="access-category">
                    <h3>CALENDAR</h3>
                    <a href="https://calendar.google.com/" target="_blank" rel="noopener noreferrer">GOOGLE CALENDAR</a>
                </div>
                <div class="access-category">
                    <h3>DEVELOPMENT</h3>
                    <a href="https://console.firebase.google.com/" target="_blank" rel="noopener noreferrer">FIREBASE</a>
                    <a href="https://github.com/stax0r" target="_blank" rel="noopener noreferrer">GITHUB</a>
                </div>
                <div class="access-category">
                    <h3>MEDIA</h3>
                    <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YOUTUBE</a>
                </div>
            </div>
        </section>

        <section class="home-panel rss-panel">
            <h2>// RSS NEWS FEEDS</h2>
            <div class="rss-window">
                <div class="rss-track">
                    <ul class="rss-list">
                        <li class="rss-message">LOADING NEWS...</li>
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <nav class="home-nav" aria-label="Primary navigation">
        <a class="b-button" href="index.html">OPEN PORTFOLIO</a>
    </nav>

    <script>
        // Add, remove, or replace RSS sources here.
        const rssFeeds = [
            {
                name: 'BBC NEWS',
                category: 'GLOBAL HEADLINES',
                url: 'https://feeds.bbci.co.uk/news/rss.xml'
            },
            {
                name: 'NYT TECHNOLOGY',
                category: 'TECHNOLOGY',
                url: 'https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml'
            },
            {
                name: 'HACKER NEWS',
                category: 'ENGINEERING // STARTUPS',
                url: 'https://hnrss.org/frontpage'
            }
        ];

        const feedProxy = 'https://api.rss2json.com/v1/api.json?rss_url=';
        const rssList = document.querySelector('.rss-list');
        const rssWindow = document.querySelector('.rss-window');

        function getSummary(description) {
            const plainText = document.createElement('div');
            plainText.innerHTML = description || '';
            const summary = plainText.textContent.trim().replace(/\s+/g, ' ');
            return summary ? `${summary.slice(0, 240)}${summary.length > 240 ? '...' : ''}` : 'NO SUMMARY AVAILABLE.';
        }

        function createFeedItem(feed, item) {
            const entry = document.createElement('li');
            const content = document.createElement('div');
            const source = document.createElement('small');
            const link = document.createElement('a');
            const summary = document.createElement('p');
            const meta = document.createElement('span');

            source.textContent = `${feed.name} // ${feed.category}`;
            link.href = item.link || feed.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = item.title || feed.name;
            summary.textContent = getSummary(item.description);
            meta.textContent = item.pubDate
                ? new Date(item.pubDate).toISOString().slice(0, 10)
                : feed.category;

            content.className = 'rss-content';
            source.className = 'rss-source';
            link.className = 'rss-title';
            summary.className = 'rss-summary';
            content.append(source, link, summary);
            entry.append(content, meta);
            return entry;
        }

        async function loadFeed(feed) {
            const response = await fetch(`${feedProxy}${encodeURIComponent(feed.url)}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            if (data.status !== 'ok' || !Array.isArray(data.items)) {
                throw new Error(data.message || 'RSS SERVICE ERROR');
            }

            const items = data.items.slice(0, 20);
            return items.map((item) => createFeedItem(feed, item));
        }

        async function loadNews() {
            const scrollTop = rssWindow.scrollTop;
            const results = await Promise.allSettled(rssFeeds.map(loadFeed));
            const entries = results.flatMap((result, index) => {
                if (result.status === 'fulfilled') {
                    return result.value;
                }

                const fallback = document.createElement('li');
                fallback.className = 'rss-message';
                fallback.textContent = `${rssFeeds[index].name}: FEED UNAVAILABLE`;
                return [fallback];
            });

            rssList.replaceChildren(...entries);
            rssWindow.scrollTop = scrollTop;
        }

        loadNews();
        setInterval(loadNews, 15 * 60 * 1000);
    </script>
</body>
</html>
